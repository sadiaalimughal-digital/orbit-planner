<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1f5e"/>
      <stop offset="100%" stop-color="#0b1030"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffd23f"/>
      <stop offset="45%" stop-color="#ff5fa8"/>
      <stop offset="100%" stop-color="#4d2090"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5fa8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff5fa8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Glow halo -->
  <circle cx="256" cy="256" r="120" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Orbit rings -->
  <ellipse cx="256" cy="256" rx="175" ry="175" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="6 8"/>
  <ellipse cx="256" cy="256" rx="120" ry="120" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Planet -->
  <circle cx="256" cy="256" r="80" fill="url(#planet)"/>

  <!-- Planet shine -->
  <ellipse cx="236" cy="228" rx="28" ry="18" fill="#fff" fill-opacity="0.18" transform="rotate(-20 236 228)"/>

  <!-- Orbiting dots -->
  <!-- Pink dot -->
  <circle cx="256" cy="81" r="16" fill="#ff5fa8"/>
  <circle cx="254" cy="78" r="5" fill="#fff" fill-opacity="0.5"/>

  <!-- Teal dot -->
  <circle cx="416" cy="310" r="13" fill="#39f2b0"/>
  <circle cx="414" cy="307" r="4" fill="#fff" fill-opacity="0.4"/>

  <!-- Yellow dot -->
  <circle cx="130" cy="330" r="11" fill="#ffd23f"/>
  <circle cx="128" cy="327" r="3.5" fill="#fff" fill-opacity="0.4"/>

  <!-- Blue dot -->
  <circle cx="388" cy="148" r="9" fill="#6f8cff"/>
  <circle cx="386" cy="146" r="3" fill="#fff" fill-opacity="0.4"/>

  <!-- Small star dots -->
  <circle cx="160" cy="140" r="3" fill="#fff" fill-opacity="0.4"/>
  <circle cx="370" cy="390" r="2.5" fill="#fff" fill-opacity="0.3"/>
  <circle cx="440" cy="230" r="2" fill="#fff" fill-opacity="0.35"/>
  <circle cx="100" cy="200" r="2" fill="#fff" fill-opacity="0.3"/>
</svg>
